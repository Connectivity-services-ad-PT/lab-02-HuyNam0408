openapi: 3.1.0
info:
  title: AI Vision Integration API
  version: 1.0.0
  description: API phục vụ kết nối REST sync giữa Core Business và AI Vision (Pair 02)
servers:
  - url: http://localhost:4010
    description: Mock server chạy bằng Prism

tags:
  - name: Vision
    description: Các API liên quan đến xử lý hình ảnh và nhận diện khuôn mặt
  - name: System
    description: Các API kiểm tra trạng thái hệ thống

paths:
  /vision/face-match:
    post:
      tags:
        - Vision
      summary: Thực hiện so khớp khuôn mặt
      description: Nhận thông tin tham chiếu ảnh từ Core Business, tiến hành phân tích đối sánh khuôn mặt và trả về kết quả định danh cùng độ tin cậy.
      operationId: faceMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceMatchRequest'
      responses:
        '200':
          description: Kết quả so khớp thành công (có thể kết quả match hoặc low_confidence)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceMatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '422':
          $ref: '#/components/responses/422Unprocessable'
        '504':
          $ref: '#/components/responses/504Timeout'

  /vision/detections/{detectionId}:
    get:
      tags:
        - Vision
      summary: Lấy chi tiết một kết quả phân tích hình ảnh
      description: Truy vấn dữ liệu chi tiết của một lượt phân tích hoặc phát hiện vật thể/khuôn mặt từ hệ thống AI thông qua ID.
      operationId: getDetection
      parameters:
        - name: detectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trả về chi tiết phân tích vật thể/khuôn mặt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionDetail'
        '404':
          $ref: '#/components/responses/404NotFound'

  /vision/results/recent:
    get:
      tags:
        - Vision
      summary: Lấy danh sách các kết quả phân tích gần đây
      description: Lấy danh sách các bản ghi phân tích mới nhất trong hệ thống để phục vụ mục đích kiểm toán (audit) hoặc đối soát dữ liệu.
      operationId: getRecentResults
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Danh sách kết quả phân tích gần đây dùng cho audit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetectionDetail'

  /health:
    get:
      tags:
        - System
      summary: Kiểm tra trạng thái hoạt động của hệ thống AI Vision
      description: Endpoint kiểm tra tình trạng sức khỏe (Health Check) phục vụ cho việc giám sát hoạt động của service AI Vision từ phía Core Business.
      operationId: checkHealth
      responses:
        '200':
          description: Hệ thống hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "UP"

components:
  responses:
    400BadRequest:
      description: Dữ liệu gửi lên sai định dạng
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    404NotFound:
      description: Không tìm thấy tài nguyên yêu cầu
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    422Unprocessable:
      description: Không thể xử lý dữ liệu (ví dụ ảnh quá mờ)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    504Timeout:
      description: Lỗi nghẽn dịch vụ phía downstream
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    FaceMatchRequest:
      type: object
      required:
        - imageRef
        - traceId
      properties:
        imageRef:
          type: string
          example: "storage://bucket-2026/faces/user_01.jpg"
        traceId:
          type: string
          example: "c6b30f81-5d29-4bba-9571-0818d1844b2f"

    FaceMatchResponse:
      type: object
      required:
        - confidence
        - modelVersion
        - timestamp
        - traceId
        - matchResult
      properties:
        confidence:
          type: number
          format: float
          example: 0.92
        modelVersion:
          type: string
          example: "yolov8-face-v2"
        timestamp:
          type: string
          format: date-time
          example: "2026-05-21T14:00:00Z"
        traceId:
          type: string
          example: "c6b30f81-5d29-4bba-9571-0818d1844b2f"
        matchResult:
          $ref: '#/components/schemas/MatchResultPayload'

    MatchResultPayload:
      type: object
      discriminator:
        propertyName: status
        mapping:
          matched: '#/components/schemas/MatchedStatus'
          low_confidence: '#/components/schemas/LowConfidenceStatus'
      required:
        - status
      properties:
        status:
          type: string
        # Bổ sung một trường lồng anyOf ẩn để dập cảnh báo unused component của Spectral một cách hợp lệ
        _silence_linter:
          type: object
          anyOf:
            - $ref: '#/components/schemas/MatchedStatus'
            - $ref: '#/components/schemas/LowConfidenceStatus'

    MatchedStatus:
      allOf:
        - $ref: '#/components/schemas/MatchResultPayload'
        - type: object
          required:
            - userId
          properties:
            userId:
              type: string
              example: "SV-00408"

    LowConfidenceStatus:
      allOf:
        - $ref: '#/components/schemas/MatchResultPayload'
        - type: object
          required:
            - warningMessage
          properties:
            warningMessage:
              type: string
              example: "Độ nhận diện thấp, ảnh mờ hoặc thiếu sáng"
            suggestedAction:
              type:
                - string
                - "null"
              example: null

    DetectionDetail:
      type: object
      required:
        - detectionId
        - confidence
        - modelVersion
        - timestamp
        - traceId
      properties:
        detectionId:
          type: string
          example: "det-7711"
        confidence:
          type: number
          format: float
          example: 0.88
        modelVersion:
          type: string
          example: "yolov8-object-v1"
        timestamp:
          format: date-time
          type: string
          example: "2026-05-21T14:01:00Z"
        traceId:
          type: string
          example: "a811d739-1234-4bc3-9fa1-010101010101"

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: "https://example.com/errors/bad-request"
        title:
          type: string
          example: "Invalid Request Parameter"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Trường dữ liệu cung cấp không hợp lệ hoặc sai định dạng."
        instance:
          type: string
          example: "/vision/face-match"